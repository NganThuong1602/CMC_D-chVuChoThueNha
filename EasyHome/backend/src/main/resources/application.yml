server:
  port: 8081
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/easyhome;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
app:
  jwt:
    secret: ${JWT_SECRET:easyhome-dev-secret-change-this-before-deploying-2026-very-long}
  seed-demo: ${SEED_DEMO:true}
